<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alo Rico - Panel Operador</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 font-family:'Poppins',sans-serif;
 background:#0f172a;
 color:white;
 overflow-x:hidden;
}

body::before{
 content:"";
 position:fixed;
 inset:0;

 background:
 linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.90)),
 url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=1600&auto=format&fit=crop');

 background-size:cover;
 background-position:center;

 z-index:-2;
}

body::after{
 content:"";
 position:fixed;
 inset:0;
 backdrop-filter:blur(8px);
 z-index:-1;
}

.card{
 background:rgba(255,255,255,.06);
 border:1px solid rgba(255,255,255,.08);
 backdrop-filter:blur(12px);
 border-radius:28px;
 box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.pedido-card{
 background:#1e293b;
 border-radius:24px;
 padding:22px;
 border:1px solid rgba(255,255,255,.08);
 box-shadow:0 10px 30px rgba(0,0,0,.35);
 transition:.25s;
 animation:fadeIn .3s ease;
}

.pedido-card:hover{
 transform:translateY(-4px);
}

@keyframes fadeIn{

 from{
  opacity:0;
  transform:translateY(20px);
 }

 to{
  opacity:1;
  transform:translateY(0);
 }

}

.btn{
 border:none;
 border-radius:18px;
 padding:14px;
 font-weight:700;
 cursor:pointer;
 transition:.25s;
 color:white;
}

.btn:hover{
 transform:scale(1.03);
}

.scroll-area{
 max-height:78vh;
 overflow:auto;
 padding-right:4px;
}

.scroll-area::-webkit-scrollbar{
 width:6px;
}

.scroll-area::-webkit-scrollbar-thumb{
 background:#475569;
 border-radius:20px;
}

.estado-pendiente{
 background:#eab308;
 color:black;
}

.estado-preparando{
 background:#3b82f6;
}

.estado-listo{
 background:#22c55e;
}

.estado-entregado{
 background:#64748b;
}

.estado-cancelado{
 background:#ef4444;
}

@media(max-width:900px){

 .scroll-area{
  max-height:none;
 }

}

</style>

</head>

<body>

<div class="p-6">

<div class="flex flex-col xl:flex-row justify-between gap-5 mb-8">

 <div>

  <h1 class="text-5xl font-bold text-yellow-400">
   Alo Rico Panel
  </h1>

  <p class="text-gray-300 mt-2 text-lg">
   Operador • Cocina • Delivery
  </p>

 </div>

 <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

  <div class="card p-5 min-w-[170px]">

   <p class="text-gray-400 text-sm">
    Ventas Hoy
   </p>

   <h2
    id="ventas-hoy"
    class="text-2xl font-bold text-green-400 mt-2">
    Gs. 0
   </h2>

  </div>

  <div class="card p-5 min-w-[170px]">

   <p class="text-gray-400 text-sm">
    Pedidos Activos
   </p>

   <h2
    id="cantidad-pedidos"
    class="text-2xl font-bold text-blue-400 mt-2">
    0
   </h2>

  </div>

  <div class="card p-5 min-w-[170px]">

   <p class="text-gray-400 text-sm">
    Deliverys
   </p>

   <h2
    id="cantidad-delivery"
    class="text-2xl font-bold text-orange-400 mt-2">
    0
   </h2>

  </div>

  <div class="card p-5 min-w-[170px]">

   <p class="text-gray-400 text-sm">
    Estado
   </p>

   <h2 class="text-xl font-bold text-pink-400 mt-2">
    Tiempo Real
   </h2>

  </div>

 </div>

</div>

<div class="grid grid-cols-1 xl:grid-cols-4 gap-6">

 <div class="card p-5">

  <h2 class="text-3xl font-bold text-yellow-400 mb-5">
   Pendientes
  </h2>

  <div
   id="contenedor-pendientes"
   class="scroll-area space-y-5">
  </div>

 </div>

 <div class="card p-5">

  <h2 class="text-3xl font-bold text-blue-400 mb-5">
   En Preparación
  </h2>

  <div
   id="contenedor-cocina"
   class="scroll-area space-y-5">
  </div>

 </div>

 <div class="card p-5">

  <h2 class="text-3xl font-bold text-green-400 mb-5">
   Listos
  </h2>

  <div
   id="contenedor-listos"
   class="scroll-area space-y-5">
  </div>

 </div>

 <div class="card p-5">

  <h2 class="text-3xl font-bold text-gray-300 mb-5">
   Historial
  </h2>

  <div
   id="contenedor-historial"
   class="scroll-area space-y-5">
  </div>

 </div>

</div>

</div>

<audio
 id="nuevo-pedido"
 src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3">
</audio>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
 getDatabase,
 ref,
 onValue,
 update
}
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {

 apiKey: "AIzaSyADGYsqhbCFuKj2fXpontLpND_rtT7Nlno",

 authDomain: "alorico-59754.firebaseapp.com",

 databaseURL:
 "https://alorico-59754-default-rtdb.firebaseio.com",

 projectId: "alorico-59754",

 storageBucket:
 "alorico-59754.firebasestorage.app",

 messagingSenderId: "120993494626",

 appId:
 "1:120993494626:web:9f9cb0ad6fbfbd1abd033b"
};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const pendientesDiv =
document.getElementById("contenedor-pendientes");

const cocinaDiv =
document.getElementById("contenedor-cocina");

const listosDiv =
document.getElementById("contenedor-listos");

const historialDiv =
document.getElementById("contenedor-historial");

const ventasHoy =
document.getElementById("ventas-hoy");

const cantidadPedidos =
document.getElementById("cantidad-pedidos");

const cantidadDelivery =
document.getElementById("cantidad-delivery");

const audio =
document.getElementById("nuevo-pedido");

let pedidosDetectados = {};

function obtenerFechaOperativa(ts){

 const fecha =
 new Date(ts);

 if(fecha.getHours() < 4){

  fecha.setDate(
   fecha.getDate() - 1
  );

 }

 return fecha.toDateString();
}

window.abrirMaps = (url)=>{

 window.open(
  url,
  "_blank"
 );

};

onValue(ref(db,"pedidos_cocina"),(snap)=>{

 const data = snap.val();

 pendientesDiv.innerHTML = "";
 cocinaDiv.innerHTML = "";
 listosDiv.innerHTML = "";
 historialDiv.innerHTML = "";

 let totalGeneral = 0;
 let totalPedidos = 0;
 let totalDeliverys = 0;

 const hoyOperativo =
 obtenerFechaOperativa(
  Date.now()
 );

 if(!data){

  ventasHoy.innerText = "Gs. 0";
  cantidadPedidos.innerText = "0";
  cantidadDelivery.innerText = "0";

  return;
 }

 const pedidos =
 Object.entries(data);

 pedidos.forEach(([pedidoId,pedido])=>{

  if(!pedidosDetectados[pedidoId]){

   pedidosDetectados[pedidoId] = true;

   try{

    audio.currentTime = 0;

    audio.play();

   }catch(e){}

  }

 });

 pedidos.forEach(([pedidoId,pedido])=>{

  let estado =
  pedido.estado || "pendiente";

  let itemsHTML = "";

  let total = 0;

  Object.entries(pedido.items || {})
  .forEach(([k,p])=>{

   if(
    typeof p === "object" &&
    p !== null &&
    p.nombre
   ){

    total +=
    Number(p.precio) *
    Number(p.cantidad);

    itemsHTML += `
     <p>
      ${p.cantidad}x ${p.nombre}
     </p>
    `;
   }

  });

  if(itemsHTML.trim() === "")
   return;

  const fechaPedido =
  obtenerFechaOperativa(
   pedido.timestamp || Date.now()
  );

  if(fechaPedido === hoyOperativo){

   totalGeneral += total;

   if(
    estado !== "entregado" &&
    estado !== "cancelado"
   ){

    totalPedidos++;
   }

   if(
    pedido.tipoPedido === "delivery"
   ){

    totalDeliverys++;
   }

  }

  let estadoClass =
  "estado-pendiente";

  if(estado === "preparando"){

   estadoClass =
   "estado-preparando";
  }

  if(estado === "listo"){

   estadoClass =
   "estado-listo";
  }

  if(estado === "entregado"){

   estadoClass =
   "estado-entregado";
  }

  if(estado === "cancelado"){

   estadoClass =
   "estado-cancelado";
  }

  const card =
  document.createElement("div");

  card.className =
  "pedido-card";

  card.innerHTML = `

   <div class="
    flex justify-between items-center mb-4
   ">

    <h3 class="
     text-2xl font-bold
    ">
     ${
      pedido.tipoPedido === "delivery"
      ? "DELIVERY"
      : "Mesa " + pedido.mesa
     }
    </h3>

    <span class="
     ${estadoClass}
     px-4 py-1
     rounded-full
     font-bold
     text-sm
    ">
     ${estado.toUpperCase()}
    </span>

   </div>

   ${
    pedido.nombre
    ? `
    <p class="mb-2 text-cyan-300">
     👤 ${pedido.nombre}
    </p>
    `
    : ""
   }

   ${
    pedido.telefono
    ? `
    <p class="mb-4 text-green-300">
     📞 ${pedido.telefono}
    </p>
    `
    : ""
   }

   <div class="
    space-y-2
    text-lg
    text-gray-200
   ">
    ${itemsHTML}
   </div>

   ${
    pedido.observacion
    ? `
    <div class="
     mt-4
     bg-yellow-500/20
     border border-yellow-500/30
     rounded-2xl
     p-4
    ">

     <p class="
      text-yellow-300
      font-bold
      mb-2
     ">
      📝 Observaciones
     </p>

     <p class="text-white">
      ${pedido.observacion}
     </p>

    </div>
    `
    : ""
   }

   ${
    pedido.maps
    ? `
    <button
     onclick="abrirMaps('${pedido.maps}')"
     class="
      w-full
      mt-5
      bg-cyan-500
      py-3
      rounded-2xl
      font-bold
     ">

     📍 VER UBICACIÓN

    </button>
    `
    : ""
   }

   <div class="
    flex justify-between
    items-center
    mt-5 mb-5
   ">

    <span class="
     text-green-400
     font-bold
     text-2xl
    ">
     Gs. ${total.toLocaleString()}
    </span>

   </div>

   <div class="
    grid grid-cols-2 gap-3
   ">

    <button
     class="btn bg-blue-500"
     id="cocina-${pedidoId}">
     Enviar a Cocina
    </button>

    <button
     class="btn bg-green-500"
     id="listo-${pedidoId}">
     Listo
    </button>

    <button
     class="btn bg-gray-500"
     id="entregado-${pedidoId}">
     Entregado
    </button>

    <button
     class="btn bg-red-500"
     id="cancelar-${pedidoId}">
     Cancelar
    </button>

   </div>

  `;

  if(estado === "pendiente"){

   pendientesDiv.appendChild(card);
  }

  if(estado === "preparando"){

   cocinaDiv.appendChild(card);
  }

  if(estado === "listo"){

   listosDiv.appendChild(card);
  }

  if(
   estado === "entregado" ||
   estado === "cancelado"
  ){

   historialDiv.appendChild(card);
  }

  setTimeout(()=>{

   const btnCocina =
   document.getElementById(`cocina-${pedidoId}`);

   if(btnCocina){

    btnCocina.onclick = ()=>{

     update(
      ref(db,"pedidos_cocina/" + pedidoId),
      {
       estado:"preparando"
      }
     );

    };

   }

   const btnListo =
   document.getElementById(`listo-${pedidoId}`);

   if(btnListo){

    btnListo.onclick = ()=>{

     update(
      ref(db,"pedidos_cocina/" + pedidoId),
      {
       estado:"listo"
      }
     );

    };

   }

   const btnEntregado =
   document.getElementById(`entregado-${pedidoId}`);

   if(btnEntregado){

    btnEntregado.onclick = ()=>{

     update(
      ref(db,"pedidos_cocina/" + pedidoId),
      {
       estado:"entregado"
      }
     );

    };

   }

   const btnCancelar =
   document.getElementById(`cancelar-${pedidoId}`);

   if(btnCancelar){

    btnCancelar.onclick = ()=>{

     update(
      ref(db,"pedidos_cocina/" + pedidoId),
      {
       estado:"cancelado"
      }
     );

    };

   }

  },100);

 });

 ventasHoy.innerText =
 "Gs. " + totalGeneral.toLocaleString();

 cantidadPedidos.innerText =
 totalPedidos;

 cantidadDelivery.innerText =
 totalDeliverys;

});

</script>

</body>
</html>
