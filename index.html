<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alo Rico Delivery - Pizzas</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 font-family:'Poppins',sans-serif;
 background:#111827;
 color:white;
 min-height:100vh;
 overflow-x:hidden;
}

body::before{
 content:"";
 position:fixed;
 inset:0;

 background:
 linear-gradient(rgba(0,0,0,.84),rgba(0,0,0,.92)),
 url('https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1600&auto=format&fit=crop');

 background-size:cover;
 background-position:center;

 z-index:-2;
}

body::after{
 content:"";
 position:fixed;
 inset:0;
 backdrop-filter:blur(6px);
 z-index:-1;
}

header{
 text-align:center;
 padding:30px 20px 15px;
}

.logo{
 width:120px;
 border-radius:50%;
 border:4px solid #facc15;
 background:white;
 box-shadow:0 0 35px rgba(250,204,21,.35);
}

h1{
 margin-top:20px;
 font-size:40px;
 color:#facc15;
}

.sub{
 color:#d1d5db;
 margin-top:10px;
}

.formulario{
 width:95%;
 max-width:700px;
 margin:25px auto;
 background:rgba(255,255,255,.06);
 border:1px solid rgba(255,255,255,.08);
 border-radius:28px;
 padding:25px;
 backdrop-filter:blur(10px);
}

.input{
 width:100%;
 padding:16px;
 border:none;
 border-radius:16px;
 background:#1f2937;
 color:white;
 margin-top:14px;
 font-size:15px;
}

textarea.input{
 resize:none;
 height:100px;
}

.menu-container{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:22px;
 padding:25px;
 padding-bottom:320px;
 max-width:1400px;
 margin:auto;
}

.product{
 background:rgba(255,255,255,.08);
 border:1px solid rgba(255,255,255,.08);
 border-radius:28px;
 overflow:hidden;
 cursor:pointer;
 transition:.25s;
 backdrop-filter:blur(10px);
 box-shadow:0 10px 30px rgba(0,0,0,.30);
}

.product:hover{
 transform:translateY(-6px);
}

.product img{
 width:100%;
 height:190px;
 object-fit:cover;
}

.product h3{
 font-size:20px;
 margin-top:16px;
 padding:0 12px;
 text-align:center;
}

.product p{
 margin:14px 0 24px;
 text-align:center;
 font-size:22px;
 font-weight:700;
 color:#22c55e;
}

#pedido-flotante{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 width:95%;
 max-width:500px;
 background:#111827;
 border-radius:28px;
 padding:24px;
 border:1px solid rgba(255,255,255,.08);
 box-shadow:0 10px 40px rgba(0,0,0,.45);
 z-index:9999;
}

.item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:rgba(255,255,255,.05);
 padding:12px;
 border-radius:14px;
 margin-top:10px;
}

.btn-eliminar{
 width:30px;
 height:30px;
 border:none;
 border-radius:50%;
 background:#ef4444;
 color:white;
 cursor:pointer;
}

#total{
 margin-top:18px;
 font-size:28px;
 color:#22c55e;
 font-weight:bold;
 text-align:center;
}

#enviar{
 width:100%;
 margin-top:18px;
 padding:16px;
 border:none;
 border-radius:18px;
 background:#16a34a;
 color:white;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
}

#popup{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.75);
 justify-content:center;
 align-items:center;
 z-index:99999;
}

.popup-content{
 background:#111827;
 padding:28px;
 border-radius:24px;
 width:320px;
}

.popup-content input{
 width:100%;
 padding:14px;
 border:none;
 border-radius:14px;
 background:#1f2937;
 color:white;
 margin-top:15px;
}

.popup-btn{
 margin-top:15px;
 width:100%;
 padding:14px;
 border:none;
 border-radius:14px;
 font-weight:bold;
 cursor:pointer;
 color:white;
}

@media(max-width:700px){

 .menu-container{
  grid-template-columns:repeat(2,1fr);
  gap:16px;
 }

 .product img{
  height:150px;
 }

 h1{
  font-size:30px;
 }
}

</style>

</head>

<body>

<header>

<img src="logo.png" class="logo">

<h1>ALO RICO DELIVERY</h1>

<p class="sub">
Pedido Online • Delivery en Tiempo Real
</p>

</header>

<div class="formulario">

<input
 id="nombre"
 class="input"
 placeholder="Nombre y Apellido">

<input
 id="telefono"
 class="input"
 placeholder="Teléfono">

<input
 id="direccion"
 class="input"
 placeholder="Dirección de entrega">

<textarea
 id="observacion"
 class="input"
 placeholder="Observaciones del pedido"></textarea>

</div>

<div id="menu" class="menu-container"></div>

<div id="pedido-flotante">

<h2 style="
text-align:center;
font-size:28px;
margin-bottom:15px;
color:#facc15;
">
Mi Pedido
</h2>

<div id="lista"></div>

<div id="total">
Gs. 0
</div>

<button id="enviar">
ENVIAR PEDIDO
</button>

</div>

<div id="popup">

<div class="popup-content">

<h2 id="popup-nombre">
Producto
</h2>

<input
 id="cantidad"
 type="number"
 value="1"
 min="1">

<button
 id="agregar"
 class="popup-btn"
 style="background:#16a34a;">
AGREGAR
</button>

<button
 onclick="cerrarPopup()"
 class="popup-btn"
 style="background:#ef4444;">
CANCELAR
</button>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
 getDatabase,
 ref,
 push,
 onValue,
 remove
}
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {

 apiKey: "AIzaSyADGYsqhbCFuKj2fXpontLpND_rtT7Nlno",

 authDomain: "alorico-59754.firebaseapp.com",

 databaseURL:
 "https://alorico-59754-default-rtdb.firebaseio.com",

 projectId: "alorico-59754"
};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const clienteId =
"delivery_" + Date.now();

const pedidoRef =
ref(db,"pedidos/" + clienteId);

const menuDiv =
document.getElementById("menu");

const listaDiv =
document.getElementById("lista");

const totalDiv =
document.getElementById("total");

let productoSeleccionado = null;

const popup =
document.getElementById("popup");

const productosRef =
ref(db,"productos");

onValue(productosRef,(snap)=>{

 const data = snap.val();

 menuDiv.innerHTML = "";

 if(!data) return;

 Object.values(data).forEach(prod=>{

  if(prod.categoria !== "pizza")
   return;

  const div =
  document.createElement("div");

  div.className =
  "product";

  div.innerHTML = `

   <img src="${prod.imagen}">

   <h3>${prod.nombre}</h3>

   <p>
    Gs. ${Number(prod.precio).toLocaleString()}
   </p>

  `;

  div.onclick = ()=>{

   productoSeleccionado = prod;

   document.getElementById("popup-nombre")
   .innerText = prod.nombre;

   document.getElementById("cantidad")
   .value = 1;

   popup.style.display = "flex";
  };

  menuDiv.appendChild(div);

 });

});

window.cerrarPopup = ()=>{

 popup.style.display = "none";
};

document.getElementById("agregar")
.onclick = ()=>{

 const cantidad =
 parseInt(
  document.getElementById("cantidad").value
 ) || 1;

 push(pedidoRef,{

  nombre:
  productoSeleccionado.nombre,

  precio:
  Number(productoSeleccionado.precio),

  cantidad

 });

 popup.style.display = "none";
};

onValue(pedidoRef,(snap)=>{

 const data = snap.val();

 listaDiv.innerHTML = "";

 let total = 0;

 if(data){

  Object.entries(data)
  .forEach(([id,p])=>{

   total +=
   p.precio * p.cantidad;

   const div =
   document.createElement("div");

   div.className = "item";

   div.innerHTML = `

    <div>

     <p>
      ${p.cantidad}x ${p.nombre}
     </p>

     <p style="
      color:#22c55e;
      font-weight:bold;
      margin-top:4px;
     ">
      Gs. ${(p.precio * p.cantidad)
      .toLocaleString()}
     </p>

    </div>

    <button
     class="btn-eliminar">
     🗑
    </button>

   `;

   div.querySelector("button")
   .onclick = ()=>{

    remove(
     ref(
      db,
      "pedidos/" + clienteId + "/" + id
     )
    );

   };

   listaDiv.appendChild(div);

  });

 }

 totalDiv.innerText =
 "Gs. " + total.toLocaleString();

});

document.getElementById("enviar")
.onclick = ()=>{

 const nombre =
 document.getElementById("nombre")
 .value.trim();

 const telefono =
 document.getElementById("telefono")
 .value.trim();

 const direccion =
 document.getElementById("direccion")
 .value.trim();

 const observacion =
 document.getElementById("observacion")
 .value.trim();

 if(
  !nombre ||
  !telefono ||
  !direccion
 ){

  alert(
   "Completa nombre, teléfono y dirección"
  );

  return;
 }

 onValue(pedidoRef,(snap)=>{

  const data = snap.val();

  if(!data){

   alert("No hay productos");

   return;
  }

  let total = 0;

  Object.values(data).forEach(p=>{

   total +=
   p.precio * p.cantidad;
  });

  push(
   ref(db,"pedidos_cocina"),
   {

    tipoPedido:
    "delivery",

    nombre,

    telefono,

    direccion,

    observacion,

    estado:
    "pendiente",

    timestamp:
    Date.now(),

    total,

    items:data
   }
  );

  remove(pedidoRef);

  alert(
   "Pedido enviado correctamente ✔"
  );

  listaDiv.innerHTML = "";

  totalDiv.innerText = "Gs. 0";

 },{onlyOnce:true});

};

</script>

</body>
</html>
