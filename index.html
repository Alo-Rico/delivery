<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alo Rico Delivery</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 font-family:'Poppins',sans-serif;
 background:#111827;
 color:white;
 min-height:100vh;
 overflow-x:hidden;
}

body::before{
 content:"";
 position:fixed;
 inset:0;
 background:
 linear-gradient(rgba(0,0,0,.84),rgba(0,0,0,.92)),
 url('https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1600&auto=format&fit=crop');
 background-size:cover;
 background-position:center;
 z-index:-2;
}

body::after{
 content:"";
 position:fixed;
 inset:0;
 backdrop-filter:blur(6px);
 z-index:-1;
}

header{
 text-align:center;
 padding:30px 20px 15px;
}

.logo{
 width:120px;
 border-radius:50%;
 border:4px solid #facc15;
 background:white;
 box-shadow:0 0 35px rgba(250,204,21,.35);
}

h1{
 margin-top:20px;
 font-size:40px;
 color:#facc15;
}

.sub{
 color:#d1d5db;
 margin-top:10px;
}

.formulario{
 width:95%;
 max-width:700px;
 margin:25px auto;
 background:rgba(255,255,255,.06);
 border:1px solid rgba(255,255,255,.08);
 border-radius:28px;
 padding:25px;
 backdrop-filter:blur(10px);
}

.input{
 width:100%;
 padding:16px;
 border:none;
 border-radius:16px;
 background:#1f2937;
 color:white;
 margin-top:14px;
 font-size:15px;
}

textarea.input{
 resize:none;
 height:100px;
}

#usar-ubicacion{
 width:100%;
 margin-top:14px;
 padding:16px;
 border:none;
 border-radius:16px;
 background:#3b82f6;
 color:white;
 font-weight:bold;
 cursor:pointer;
}

.categorias{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 width:95%;
 max-width:900px;
 margin:0 auto 20px;
}

.cat-btn{
 padding:16px;
 border:none;
 border-radius:18px;
 color:white;
 font-weight:bold;
 cursor:pointer;
 font-size:14px;
}

#btnPizza{
 background:#ef4444;
}

#btnHamburguesa{
 background:#22c55e;
}

#btnLomito{
 background:#f59e0b;
 color:black;
}

#btnBebida{
 background:#3b82f6;
}

.menu-container{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:22px;
 padding:25px;
 padding-bottom:160px;
 max-width:1400px;
 margin:auto;
}

.product{
 background:rgba(255,255,255,.08);
 border:1px solid rgba(255,255,255,.08);
 border-radius:28px;
 overflow:hidden;
 cursor:pointer;
 transition:.25s;
 backdrop-filter:blur(10px);
 box-shadow:0 10px 30px rgba(0,0,0,.30);
}

.product:hover{
 transform:translateY(-6px);
}

.product img{
 width:100%;
 height:190px;
 object-fit:cover;
}

.product h3{
 font-size:20px;
 margin-top:16px;
 padding:0 12px;
 text-align:center;
}

.product p{
 margin:14px 0 24px;
 text-align:center;
 font-size:22px;
 font-weight:700;
 color:#22c55e;
}

#pedido-flotante{
 display:none;
 position:fixed;
 bottom:90px;
 left:50%;
 transform:translateX(-50%);
 width:95%;
 max-width:500px;
 background:#111827;
 border-radius:28px;
 padding:24px;
 border:1px solid rgba(255,255,255,.08);
 box-shadow:0 10px 40px rgba(0,0,0,.45);
 z-index:9999;
}

.item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:rgba(255,255,255,.05);
 padding:12px;
 border-radius:14px;
 margin-top:10px;
}

.btn-eliminar{
 width:30px;
 height:30px;
 border:none;
 border-radius:50%;
 background:#ef4444;
 color:white;
 cursor:pointer;
}

#total{
 margin-top:18px;
 font-size:28px;
 color:#22c55e;
 font-weight:bold;
 text-align:center;
}

#abrir-pedido{
 position:fixed;
 bottom:20px;
 right:20px;
 background:#16a34a;
 color:white;
 border:none;
 padding:18px 24px;
 border-radius:20px;
 font-weight:bold;
 font-size:16px;
 z-index:99999;
 cursor:pointer;
 box-shadow:0 10px 25px rgba(0,0,0,.35);
}

#popup{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.75);
 justify-content:center;
 align-items:center;
 z-index:99999;
}

.popup-content{
 background:#111827;
 padding:28px;
 border-radius:24px;
 width:320px;
}

.popup-content input{
 width:100%;
 padding:14px;
 border:none;
 border-radius:14px;
 background:#1f2937;
 color:white;
 margin-top:15px;
}

.popup-btn{
 margin-top:15px;
 width:100%;
 padding:14px;
 border:none;
 border-radius:14px;
 font-weight:bold;
 cursor:pointer;
 color:white;
}

@media(max-width:700px){

 .categorias{
  grid-template-columns:repeat(2,1fr);
 }

 .menu-container{
  grid-template-columns:repeat(2,1fr);
  gap:16px;
 }

 .product img{
  height:150px;
 }

 h1{
  font-size:30px;
 }

 #abrir-pedido{
  width:90%;
  right:5%;
 }
}

</style>

</head>

<body>

<header>

<img src="logo.png" class="logo">

<h1>ALO RICO DELIVERY</h1>

<p class="sub">
Delivery Online en Tiempo Real
</p>

</header>

<div class="formulario">

<input
 id="nombre"
 class="input"
 placeholder="Nombre y Apellido">

<input
 id="telefono"
 class="input"
 placeholder="Teléfono">

<textarea
 id="observacion"
 class="input"
 placeholder="Observaciones"></textarea>

<button id="usar-ubicacion">
📍 Compartir ubicación y calcular delivery
</button>

<div id="delivery-alert" style="
margin-top:15px;
padding:16px;
border-radius:18px;
background:rgba(234,179,8,.18);
border:1px solid rgba(234,179,8,.35);
color:#fde68a;
font-weight:600;
line-height:1.5;
">

🚚 Comparte tu ubicación para calcular automáticamente el costo del delivery.

</div>

<div id="delivery-info" style="
display:none;
margin-top:14px;
padding:16px;
border-radius:18px;
background:rgba(34,197,94,.15);
border:1px solid rgba(34,197,94,.35);
">

<p style="
color:#86efac;
font-weight:bold;
font-size:18px;
">

Costo Delivery:
<span id="delivery-precio">
Gs. 0
</span>

</p>

</div>

</div>

<div class="categorias">

<button id="btnPizza" class="cat-btn">
🍕 PIZZAS
</button>

<button id="btnHamburguesa" class="cat-btn">
🍔 HAMBURGUESAS
</button>

<button id="btnLomito" class="cat-btn">
🥪 LOMITOS
</button>

<button id="btnBebida" class="cat-btn">
🥤 BEBIDAS
</button>

</div>

<div id="menu" class="menu-container"></div>

<button id="abrir-pedido">
🛒 ENVIAR PEDIDO
</button>

<div id="pedido-flotante">

<h2 style="
text-align:center;
font-size:28px;
margin-bottom:15px;
color:#facc15;
">
Mi Pedido
</h2>

<div id="lista"></div>

<div id="total">
Gs. 0
</div>

</div>

<div id="popup">

<div class="popup-content">

<h2 id="popup-nombre">
Producto
</h2>

<input
 id="cantidad"
 type="number"
 value="1"
 min="1">

<button
 id="btn-entera"
 class="popup-btn"
 style="background:#16a34a;">
AGREGAR
</button>

<button
 id="btn-media"
 class="popup-btn"
 style="background:#f59e0b;">
🍕 MEDIA
</button>

<button
 onclick="cerrarPopup()"
 class="popup-btn"
 style="background:#ef4444;">
CANCELAR
</button>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
 getDatabase,
 ref,
 push,
 onValue,
 remove
}
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {

 apiKey: "AIzaSyADGYsqhbCFuKj2fXpontLpND_rtT7Nlno",

 authDomain: "alorico-59754.firebaseapp.com",

 databaseURL:
 "https://alorico-59754-default-rtdb.firebaseio.com",

 projectId: "alorico-59754"
};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const clienteId =
"delivery_" + Date.now();

const pedidoRef =
ref(db,"pedidos/" + clienteId);

const menuDiv =
document.getElementById("menu");

const listaDiv =
document.getElementById("lista");

const totalDiv =
document.getElementById("total");

let productoSeleccionado = null;

let categoriaActual = "pizza";

let mapsLink = "";

let deliveryCosto = 0;

const ALO_RICO_LAT = -25.385353;
const ALO_RICO_LNG = -57.353822;

let mediaPizza = null;

const popup =
document.getElementById("popup");

let timeoutPedido = null;

function actualizarTotal(){

 let total = 0;

 document
 .querySelectorAll(".precio-item")
 .forEach(el=>{

  total += Number(
   el.dataset.valor
  );

 });

 total += deliveryCosto;

 totalDiv.innerText =
 "Gs. " + total.toLocaleString();
}

document
.getElementById("abrir-pedido")
.onclick = ()=>{

 const panel =
 document.getElementById("pedido-flotante");

 if(panel.style.display === "block"){

  enviarPedido();

  return;
 }

 panel.style.display = "block";

 clearTimeout(timeoutPedido);

 timeoutPedido = setTimeout(()=>{

  panel.style.display = "none";

 },7000);

};

function cargarProductos(){

 const productosRef =
 ref(db,"productos");

 onValue(productosRef,(snap)=>{

  const data = snap.val();

  menuDiv.innerHTML = "";

  if(!data) return;

  Object.values(data).forEach(prod=>{

   if(prod.categoria !== categoriaActual)
    return;

   const div =
   document.createElement("div");

   div.className =
   "product";

   div.innerHTML = `

   <img src="${prod.imagen}">

   <h3>${prod.nombre}</h3>

   <p>
    Gs. ${Number(prod.precio).toLocaleString()}
   </p>

   `;

   div.onclick = ()=>{

    productoSeleccionado = prod;

    document.getElementById("popup-nombre")
    .innerText = prod.nombre;

    document.getElementById("cantidad")
    .value = 1;

    popup.style.display = "flex";

    if(categoriaActual !== "pizza"){

     document.getElementById("btn-media")
     .style.display = "none";

     document.getElementById("btn-entera")
     .innerText = "AGREGAR";

    }else{

     document.getElementById("btn-media")
     .style.display = "block";

     document.getElementById("btn-entera")
     .innerText = "🍕 ENTERA";
    }

   };

   menuDiv.appendChild(div);

  });

 });

}

cargarProductos();

document.getElementById("btnPizza")
.onclick = ()=>{

 categoriaActual = "pizza";
 cargarProductos();
};

document.getElementById("btnHamburguesa")
.onclick = ()=>{

 categoriaActual = "hamburguesa";
 cargarProductos();
};

document.getElementById("btnLomito")
.onclick = ()=>{

 categoriaActual = "lomitos";
 cargarProductos();
};

document.getElementById("btnBebida")
.onclick = ()=>{

 categoriaActual = "bebidas";
 cargarProductos();
};

function calcularDistanciaKm(
 lat1,
 lon1,
 lat2,
 lon2
){

 const R = 6371;

 const dLat =
 (lat2-lat1) * Math.PI/180;

 const dLon =
 (lon2-lon1) * Math.PI/180;

 const a =

 Math.sin(dLat/2) *
 Math.sin(dLat/2)

 +

 Math.cos(lat1*Math.PI/180) *
 Math.cos(lat2*Math.PI/180)

 *

 Math.sin(dLon/2) *
 Math.sin(dLon/2);

 const c =
 2 * Math.atan2(
  Math.sqrt(a),
  Math.sqrt(1-a)
 );

 return R * c;
}

function redondearDelivery(valor){

 if(valor <= 5000)
  return 5000;

 return Math.ceil(valor / 5000) * 5000;
}

document
.getElementById("usar-ubicacion")
.onclick = ()=>{

 navigator.geolocation
 .getCurrentPosition(pos=>{

  const lat =
  pos.coords.latitude;

  const lng =
  pos.coords.longitude;

  mapsLink =
  `https://maps.google.com/?q=${lat},${lng}`;

  const distancia =
  calcularDistanciaKm(
   ALO_RICO_LAT,
   ALO_RICO_LNG,
   lat,
   lng
  );

  let costoBase =
  distancia * 2000;

  deliveryCosto =
  redondearDelivery(costoBase);

  document
  .getElementById("delivery-alert")
  .style.display = "none";

  document
  .getElementById("delivery-info")
  .style.display = "block";

  document
  .getElementById("delivery-precio")
  .innerText =
  "Gs. " +
  deliveryCosto.toLocaleString();

  actualizarTotal();

  alert(
   "Ubicación cargada ✔"
  );

 },()=>{

  alert(
   "No se pudo obtener ubicación"
  );

 });

};

window.cerrarPopup = ()=>{

 popup.style.display = "none";
};

document.getElementById("btn-entera")
.onclick = ()=>{

 const cantidad =
 parseInt(
  document.getElementById("cantidad").value
 ) || 1;

 push(pedidoRef,{

  nombre:
  productoSeleccionado.nombre,

  precio:
  Number(productoSeleccionado.precio),

  cantidad,

  categoria:
  productoSeleccionado.categoria,

  tipo:
  categoriaActual === "pizza"
  ? "Pizza Entera"
  : "Normal"

 });

 popup.style.display = "none";
};

document.getElementById("btn-media")
.onclick = ()=>{

 const cantidad =
 parseInt(
  document.getElementById("cantidad").value
 ) || 1;

 if(!mediaPizza){

  mediaPizza = {

   nombre:
   productoSeleccionado.nombre,

   precio:
   Number(productoSeleccionado.precio),

   cantidad

  };

  popup.style.display = "none";

  alert(
   "Ahora selecciona la otra mitad 🍕"
  );

 }else{

  const nombreFinal =
  mediaPizza.nombre +
  " / " +
  productoSeleccionado.nombre;

  const precioFinal =
  Math.max(
   mediaPizza.precio,
   Number(productoSeleccionado.precio)
  );

  push(pedidoRef,{

   nombre:nombreFinal,

   precio:precioFinal,

   cantidad:mediaPizza.cantidad,

   categoria:"pizza",

   tipo:"Media y Media"

  });

  mediaPizza = null;

  popup.style.display = "none";
 }

};

onValue(pedidoRef,(snap)=>{

 const data = snap.val();

 listaDiv.innerHTML = "";

 let total = 0;

 if(data){

  Object.entries(data)
  .forEach(([id,p])=>{

   total +=
   p.precio * p.cantidad;

   const div =
   document.createElement("div");

   div.className = "item";

   div.innerHTML = `

    <div>

     <p>
      ${p.cantidad}x ${p.nombre}
     </p>

     <p style="
      color:#facc15;
      font-size:13px;
      margin-top:4px;
     ">
      ${p.tipo || ""}
     </p>

     <p
      class="precio-item"
      data-valor="${p.precio * p.cantidad}"
      style="
      color:#22c55e;
      font-weight:bold;
      margin-top:4px;
     ">
      Gs. ${(p.precio * p.cantidad)
      .toLocaleString()}
     </p>

    </div>

    <button
     class="btn-eliminar">
     🗑
    </button>

   `;

   div.querySelector("button")
   .onclick = ()=>{

    remove(
     ref(
      db,
      "pedidos/" + clienteId + "/" + id
     )
    );

   };

   listaDiv.appendChild(div);

  });

 }

 total += deliveryCosto;

 totalDiv.innerText =
 "Gs. " + total.toLocaleString();

});

function enviarPedido(){

 const nombre =
 document.getElementById("nombre")
 .value.trim();

 const telefono =
 document.getElementById("telefono")
 .value.trim();

 const observacion =
 document.getElementById("observacion")
 .value.trim();

 if(
  !nombre ||
  !telefono
 ){

  alert(
   "Completa nombre y teléfono"
  );

  return;
 }

 onValue(pedidoRef,(snap)=>{

  const data = snap.val();

  if(!data){

   alert("No hay productos");

   return;
  }

  let total = 0;

  Object.values(data).forEach(p=>{

   total +=
   p.precio * p.cantidad;
  });

  push(
   ref(db,"pedidos_cocina"),
   {

    tipoPedido:
    "delivery",

    mesa:
    "DELIVERY",

    nombre,

    telefono,

    observacion,

    maps:
    mapsLink,

    estado:
    "pendiente",

    timestamp:
    Date.now(),

    deliveryCosto,

    total: total + deliveryCosto,

    items:data
   }
  );

  remove(pedidoRef);

  alert(
   "Pedido enviado correctamente ✔"
  );

  listaDiv.innerHTML = "";

  totalDiv.innerText = "Gs. 0";

  document.getElementById("pedido-flotante")
  .style.display = "none";

 },{onlyOnce:true});

}

</script>

</body>
</html>
